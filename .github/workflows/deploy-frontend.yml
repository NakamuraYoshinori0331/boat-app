name: Deploy Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: boat-ai-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E358EP25UOKH3Z

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          REACT_APP_API_URL: https://api.boat-ai.click
          DISABLE_ESLINT_PLUGIN: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/build/static s3://${{ env.S3_BUCKET }}/static \
            --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync frontend/build/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --exclude "static/*" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Verify S3 upload
        working-directory: frontend
        run: |
          LOCAL_JS=$(grep -o 'main\.[^"]*\.js' build/index.html | head -1)
          REMOTE_JS=$(aws s3 cp "s3://${{ env.S3_BUCKET }}/index.html" - | grep -o 'main\.[^"]*\.js' | head -1)
          echo "Local bundle:  $LOCAL_JS"
          echo "Remote bundle: $REMOTE_JS"
          if [ "$LOCAL_JS" != "$REMOTE_JS" ]; then
            echo "S3 index.html does not match the build output"
            exit 1
          fi
          aws s3 ls "s3://${{ env.S3_BUCKET }}/static/js/$LOCAL_JS"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

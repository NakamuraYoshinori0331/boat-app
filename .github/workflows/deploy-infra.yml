name: Deploy Infrastructure

on:
  push:
    branches: [main, develop]
    paths:
      - "infra/**"
      - "backend/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove legacy EC2 API DNS record (if any)
        run: |
          RECORD=$(aws route53 list-resource-record-sets \
            --hosted-zone-id Z08328995IC1UT7ZFPO \
            --query "ResourceRecordSets[?Name=='api.boat-ai.click.' && Type=='A' && !AliasTarget]" \
            --output json)
          if [ "$RECORD" != "[]" ]; then
            IP=$(echo "$RECORD" | jq -r '.[0].ResourceRecords[0].Value')
            TTL=$(echo "$RECORD" | jq -r '.[0].TTL')
            aws route53 change-resource-record-sets --hosted-zone-id Z08328995IC1UT7ZFPO --change-batch "$(cat <<EOF
          {
            "Changes": [{
              "Action": "DELETE",
              "ResourceRecordSet": {
                "Name": "api.boat-ai.click",
                "Type": "A",
                "TTL": $TTL,
                "ResourceRecords": [{"Value": "$IP"}]
              }
            }]
          }
          EOF
          )"
          fi

      - name: CDK deploy
        working-directory: infra
        run: |
          npx cdk bootstrap aws://008116135513/ap-northeast-1
          npx cdk deploy --all --require-approval never
